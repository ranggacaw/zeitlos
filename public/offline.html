<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline - Zeitlos</title>
        <meta name="theme-color" content="#020617" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <style>
            :root { color-scheme: dark; }
            html, body { height: 100%; }
            body {
                margin: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #020617;
                color: #e2e8f0;
                font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                padding: 1.5rem;
                text-align: center;
            }
            .card {
                max-width: 28rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: rgba(255, 255, 255, 0.04);
                border-radius: 1.5rem;
                padding: 2.5rem 1.75rem;
            }
            .badge {
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.4em;
                text-transform: uppercase;
                color: #fcd34d;
            }
            h1 { font-size: 1.5rem; margin: 0.75rem 0 0.5rem; }
            p { margin: 0 0 1.5rem; color: #94a3b8; line-height: 1.5; }
            a {
                display: inline-block;
                background: #fbbf24;
                color: #020617;
                text-decoration: none;
                font-weight: 700;
                padding: 0.6rem 1.25rem;
                border-radius: 9999px;
            }
        </style>
    </head>
    <body>
        <main class="card" role="alert" aria-live="polite">
            <p class="badge">FC Zeitlos</p>
            <h1>You're offline</h1>
            <p>We couldn't reach the server. Reconnect to load the latest schedule, roster, and live match updates.</p>
            <a href="/">Try again</a>
        </main>
        <script>
            window.addEventListener('online', () => window.location.reload());
        </script>
    </body>
</html>
